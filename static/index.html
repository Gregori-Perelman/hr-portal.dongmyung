<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Portal · 근태관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #EBEDEF;
    --paper: #FFFFFF;
    --line: #D9DCE0;
    --ink: #1C1E22;
    --ink-soft: #52565E;
    --muted: #8D9198;
    --brand: #7C5B2A;
    --brand-2: #96713A;
    --stamp-red: #AF3529;
    --stamp-red-soft: #AF352922;
    --amber: #52677D;
    --amber-soft: #52677D1c;
    --green: #2E6B52;
    --green-soft: #2E6B521c;
    --gray-soft: #8D91981c;
    --sidebar-bg: #20242B;
    --sat-blue: #2A5FA0;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex;}

  /* ---------- Login ---------- */
  .login-wrap{
    width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, #ffffff55, transparent 40%),
      linear-gradient(180deg, var(--bg), #E3E7EE);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:420px; background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:40px 34px; box-shadow:0 20px 50px -20px #16213e2e;
  }
  .login-eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted);
    text-transform:uppercase; margin-bottom:6px;
  }
  .login-title{ font-size:26px; font-weight:800; margin:0 0 4px; letter-spacing:-.02em;}
  .login-sub{ color:var(--ink-soft); font-size:14px; margin:0 0 28px; line-height:1.6;}
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  select, input[type=text], input[type=date], textarea{
    width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Pretendard', sans-serif; font-size:14.5px; color:var(--ink); background:#fff;
    outline:none; transition:border-color .15s;
  }
  select:focus, input:focus, textarea:focus{ border-color:var(--brand-2); }
  .divider-or{
    display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:22px 0 18px;
  }
  .divider-or::before, .divider-or::after{ content:''; flex:1; height:1px; background:var(--line); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 18px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Pretendard', sans-serif; font-weight:700; font-size:14.5px; transition:.15s;
  }
  .btn-primary{ background:var(--brand); color:#fff; width:100%; }
  .btn-primary:hover{ background:var(--brand-2); }
  .btn-ghost{ background:transparent; color:var(--brand); border:1.5px solid var(--line); width:100%;}
  .btn-ghost:hover{ background:#f2f4f8; }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:8px; }
  .btn-danger{ background:#fff; color:var(--stamp-red); border:1.5px solid var(--stamp-red); }
  .btn-approve{ background:var(--green); color:#fff; }
  .btn-reject{ background:#fff; color:var(--stamp-red); border:1.5px solid var(--stamp-red); }

  /* ---------- Layout ---------- */
  .sidebar{
    width:232px; background:
      repeating-linear-gradient(180deg, #ffffff08 0px, #ffffff08 1px, transparent 1px, transparent 28px),
      var(--sidebar-bg);
    color:#fff; flex-shrink:0;
    display:flex; flex-direction:column; padding:26px 18px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:34px; padding:0 6px;}
  .brand-mark{
    width:32px; height:32px; border-radius:50%; border:2.5px solid var(--stamp-red);
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{
    content:''; position:absolute; inset:5px; border:1px solid var(--stamp-red); border-radius:50%;
  }
  .brand-name{ font-weight:800; font-size:16.5px; letter-spacing:-.01em;}
  .brand-sub{ font-size:10.5px; color:#ffffff99; font-family:var(--mono); letter-spacing:.08em;}
  nav.navlist{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    color:#ffffffb0; font-size:14px; font-weight:600; cursor:pointer; transition:.12s;
  }
  .nav-item:hover{ background:#ffffff14; color:#fff; }
  .nav-item.active{ background:var(--brand); color:#fff; }
  .nav-icon{ width:18px; text-align:center; font-size:15px; }
  .nav-badge{
    margin-left:auto; background:var(--stamp-red); color:#fff; font-size:10.5px; font-weight:800;
    border-radius:20px; padding:1px 7px; font-family:var(--mono);
  }
  .side-user{
    border-top:1px solid #ffffff22; padding-top:14px; margin-top:10px;
  }
  .side-user-name{ font-weight:700; font-size:14px; }
  .side-user-role{ font-size:11px; color:#ffffff90; margin-bottom:10px;}
  .switch-link{ font-size:12px; color:#ffffffb0; cursor:pointer; text-decoration:underline; }
  .switch-link:hover{ color:#fff; }

  .main{ flex:1; padding:36px 44px; max-width:1180px; }
  .page-head{ margin-bottom:26px; }
  .page-eyebrow{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  .page-title{ font-size:25px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .page-desc{ color:var(--ink-soft); font-size:14px; margin-top:6px; }

  .grid{ display:grid; gap:18px; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:1.3fr 1fr; }
  @media(max-width:900px){ .grid-3,.grid-2{grid-template-columns:1fr;} }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px;
  }
  .stat-card .stat-label{ font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .stat-card .stat-value{ font-family:var(--mono); font-size:34px; font-weight:700; margin:8px 0 2px; color:var(--brand);}
  .stat-card .stat-sub{ font-size:12.5px; color:var(--ink-soft); }

  .section-title{ font-size:15px; font-weight:800; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between;}

  /* ---------- Request cards & stamps ---------- */
  .req-list{ display:flex; flex-direction:column; gap:12px; }
  .req-card{
    border:1px solid var(--line); border-radius:12px; padding:16px 18px; position:relative;
    display:flex; align-items:center; gap:16px; background:#fbfcfe;
  }
  .req-type-chip{
    font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .req-main{ flex:1; min-width:0; }
  .req-title-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .req-name{ font-weight:800; font-size:14.5px; }
  .req-dates{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); }
  .req-reason{ font-size:13px; color:var(--muted); margin-top:3px; }
  .req-actions{ display:flex; gap:8px; flex-shrink:0; }

  .stamp{
    width:58px; height:58px; border-radius:50%; border:2.5px solid var(--stamp-red); color:var(--stamp-red);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
    transform:rotate(-14deg); flex-shrink:0; font-family:'Pretendard'; letter-spacing:-.02em;
    position:relative;
  }
  .stamp::after{
    content:''; position:absolute; inset:5px; border:1px solid var(--stamp-red); border-radius:50%;
  }
  .stamp.rejected{ border-color:var(--muted); color:var(--muted); }
  .stamp.rejected::after{ border-color:var(--muted); }
  .stamp.pending{
    border-style:dashed; color:var(--amber); border-color:var(--amber);
  }
  .stamp.pending::after{ border-style:dashed; border-color:var(--amber);}
  .stamp.info{ border-color:#3B7B7B; color:#3B7B7B; }
  .stamp.info::after{ border-color:#3B7B7B; }

  .empty{
    text-align:center; padding:44px 20px; color:var(--muted); font-size:13.5px;
  }
  .empty-icon{ font-size:30px; margin-bottom:10px; }

  /* ---------- Calendar ---------- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-nav{ display:flex; align-items:center; gap:10px; }
  .cal-month{ font-weight:800; font-size:17px; font-family:var(--mono); min-width:120px; text-align:center;}
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ text-align:center; font-size:11.5px; color:var(--muted); font-weight:700; padding-bottom:6px;}
  .cal-cell{
    min-height:88px; border-radius:10px; border:1px solid var(--line); padding:6px; background:#fbfcfe;
    display:flex; flex-direction:column; gap:3px; transition:.12s;
  }
  .cal-cell:hover{ border-color:var(--brand-2); box-shadow:0 4px 12px -4px #0002; transform:translateY(-1px); }
  .cal-cell.other-month{ opacity:.35; }
  .cal-cell.today{ border-color:var(--brand-2); box-shadow:inset 0 0 0 1px var(--brand-2); }
  .cal-daynum{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); font-weight:600; }
  .cal-tag{
    font-size:10px; font-weight:700; padding:2px 5px; border-radius:5px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .legend-dot{ width:9px; height:9px; border-radius:3px; }

  /* ---------- Form ---------- */
  .form-card{ max-width:560px; }
  .type-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .type-opt{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer;
    font-size:12.5px; font-weight:700; transition:.12s; color:var(--ink-soft);
  }
  .type-opt:hover{ border-color:var(--brand-2); }
  .type-opt.selected{ border-color:var(--brand); background:var(--brand); color:#fff; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .half-toggle{ display:flex; gap:8px; margin-top:8px; }
  .half-opt{
    flex:1; text-align:center; padding:9px; border-radius:9px; border:1.5px solid var(--line);
    font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-soft);
  }
  .half-opt.selected{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }

  /* ---------- Members table ---------- */
  table.members{ width:100%; border-collapse:collapse; }
  table.members th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; padding:8px 10px; border-bottom:1.5px solid var(--line);
  }
  table.members td{ padding:11px 10px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .role-pill{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .toggle-btn{
    font-size:12px; padding:5px 10px; border-radius:7px; border:1.5px solid var(--line); background:#fff;
    cursor:pointer; font-weight:700; color:var(--ink-soft);
  }
  .toggle-btn.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  input.balance-input{ width:64px; font-family:var(--mono); text-align:center; padding:5px; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:10px; font-size:13.5px;
    font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* ---------- Mobile top bar (hidden on desktop) ---------- */
  .mobile-topbar{ display:none; }

  /* ---------- Blocking modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:#12141866; display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .modal-box{
    background:var(--paper); border-radius:16px; padding:30px 26px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 30px 60px -20px #00000055;
  }
  .modal-stamp{
    width:52px; height:52px; border-radius:50%; border:2.5px solid var(--stamp-red); color:var(--stamp-red);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:20px; font-weight:800;
    position:relative;
  }
  .modal-stamp::after{ content:''; position:absolute; inset:4px; border:1px solid var(--stamp-red); border-radius:50%; }
  .modal-title{ font-weight:800; font-size:16.5px; margin-bottom:8px; }
  .modal-msg{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:20px; }

  /* ---------- Responsive (mobile) ---------- */
  @media (max-width: 760px){
    #app{ flex-direction:column; }
    .login-wrap{ padding:16px; }
    .login-card{ padding:28px 22px; border-radius:16px; }

    .mobile-topbar{
      display:flex; align-items:center; justify-content:space-between;
      background:var(--sidebar-bg); color:#fff; padding:12px 16px;
      position:sticky; top:0; z-index:55;
    }
    .mt-brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14.5px; }
    .mt-user{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
    .mt-user .switch-link{ color:#ffffffcc; font-size:11.5px; }

    .sidebar{
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; width:100%;
      flex-direction:row; padding:6px 4px; gap:0; z-index:60;
      box-shadow:0 -8px 24px #0003; overflow-x:auto;
    }
    .sidebar .brand, .sidebar .side-user{ display:none; }
    nav.navlist{ flex-direction:row; flex:1; gap:2px; }
    .nav-item{
      flex-direction:column; gap:2px; padding:7px 8px; font-size:10px; white-space:nowrap;
      border-radius:10px; flex:1; align-items:center; justify-content:center; position:relative;
    }
    .nav-icon{ font-size:17px; }
    .nav-badge{ position:absolute; top:2px; right:10px; padding:0 5px; }

    .main{ padding:18px 14px 90px; max-width:100%; }
    .page-title{ font-size:20px; }
    .page-desc{ font-size:13px; }
    .grid-3, .grid-2{ grid-template-columns:1fr; }
    .stat-card .stat-value{ font-size:28px; }

    .req-card{ flex-wrap:wrap; gap:10px; }
    .req-actions{ width:100%; }
    .req-actions .btn{ flex:1; }
    .stamp{ width:44px; height:44px; font-size:11px; }

    .cal-cell{ min-height:58px; padding:4px; }
    .cal-tag{ font-size:9px; padding:1px 4px; }
    .cal-month{ font-size:14.5px; min-width:90px; }

    table.members{ display:block; overflow-x:auto; white-space:nowrap; }

    .type-grid{ grid-template-columns:repeat(3,1fr); gap:6px; }
    .type-opt{ font-size:11.5px; padding:10px 4px; }
    .row-2{ grid-template-columns:1fr 1fr; gap:8px; }
  }

</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ===== Flask 백엔드 연동용 저장소 shim =====
// shared=true 인 데이터(회사 전체 근태 데이터)는 서버(Postgres)에 저장해서 모두가 공유한다.
// shared=false 인 데이터("이 브라우저에서 마지막으로 로그인한 사람" 같은 개인 편의용 정보)는
// 서버까지 갈 필요 없이 이 브라우저의 localStorage에만 저장한다.
if(!window.storage){
  const LOCAL_PREFIX = 'hrportal-local:';
  window.storage = {
    async get(key, shared){
      if(!shared){
        const raw = localStorage.getItem(LOCAL_PREFIX + key);
        if(raw === null){ throw new Error('key not found: ' + key); }
        return { key, value: raw, shared: false };
      }
      const res = await fetch('/api/storage/' + encodeURIComponent(key));
      if(res.status === 404){ throw new Error('key not found: ' + key); }
      if(!res.ok){ throw new Error('storage get failed: ' + res.status); }
      const data = await res.json();
      return { key, value: data.value, shared: true };
    },
    async set(key, value, shared){
      if(!shared){
        localStorage.setItem(LOCAL_PREFIX + key, value);
        return { key, value, shared: false };
      }
      const res = await fetch('/api/storage/' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value })
      });
      if(!res.ok){ throw new Error('storage set failed: ' + res.status); }
      const data = await res.json();
      return { key, value: data.value, shared: true };
    },
    async delete(key, shared){
      if(!shared){
        const existed = localStorage.getItem(LOCAL_PREFIX + key) !== null;
        localStorage.removeItem(LOCAL_PREFIX + key);
        return { key, deleted: existed, shared: false };
      }
      const res = await fetch('/api/storage/' + encodeURIComponent(key), { method: 'DELETE' });
      const data = await res.json();
      return { key, deleted: data.deleted, shared: true };
    },
    async list(prefix, shared){
      if(!shared){
        const full = LOCAL_PREFIX + (prefix || '');
        const keys = Object.keys(localStorage).filter(k=>k.startsWith(full)).map(k=>k.slice(LOCAL_PREFIX.length));
        return { keys, prefix, shared: false };
      }
      const res = await fetch('/api/storage?prefix=' + encodeURIComponent(prefix || ''));
      const data = await res.json();
      return { keys: data.keys, prefix, shared: true };
    }
  };
}

const SHARED_KEY = 'company-data-v1';
const PERSONAL_KEY = 'my-identity-v1';

const LEAVE_TYPES = {
  annual:   { label:'연차',      icon:'🏖️', deduct:true,  color:'#223A63', soft:'#223A6318', range:true  },
  half:     { label:'반차',      icon:'🌗', deduct:true,  color:'#34517E', soft:'#34517E18', range:false },
  reserve:  { label:'예비군훈련', icon:'🪖', deduct:false, color:'#2E7D5B', soft:'#2E7D5B18', range:true  },
  sick:     { label:'병가',      icon:'🩹', deduct:false, color:'#B23B30', soft:'#B23B3018', range:true  },
  family:   { label:'경조휴가',  icon:'🎗️', deduct:false, color:'#C4901F', soft:'#C4901F18', range:false },
  overtime: { label:'연장근무',  icon:'⏰', deduct:false, color:'#5C4A8A', soft:'#5C4A8A18', range:false },
  busytrip: { label:'출장',      icon:'✈️', deduct:false, color:'#3B7B7B', soft:'#3B7B7B18', range:true, noApproval:true },
  etc:      { label:'기타',      icon:'📌', deduct:false, color:'#8A93A6', soft:'#8A93A618', range:true  },
};
const FAMILY_SUBTYPES = {
  parent:              { label:'부모상/처가부모상', days:5 },
  marriage:            { label:'본인결혼',         days:5 },
  grandparent:         { label:'조부모상(친/외)',   days:3 },
  spouse_grandparent:  { label:'처가조부모상',      days:3 },
};
// 날짜가 겹치면 안 되는(하루를 실제로 차지하는) 유형들
const BLOCKING_TYPES = ['annual', 'half', 'family', 'busytrip'];
function findDateConflict(employeeId, startDate, endDate){
  return state.data.requests.find(r=>
    r.employeeId===employeeId &&
    r.status!=='rejected' && r.status!=='cancelled' &&
    BLOCKING_TYPES.includes(r.type) &&
    !(endDate < r.startDate || startDate > r.endDate)
  );
}

const DEFAULT_HOLIDAYS_2026 = [
  { date:'2026-01-01', label:'신정' },
  { date:'2026-02-16', label:'설날 연휴' },
  { date:'2026-02-17', label:'설날' },
  { date:'2026-02-18', label:'설날 연휴' },
  { date:'2026-03-01', label:'삼일절' },
  { date:'2026-03-02', label:'대체공휴일(삼일절)' },
  { date:'2026-05-05', label:'어린이날' },

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return fmtDate(d); }
function minAllowedDateStr(){ const d=new Date(); d.setDate(d.getDate()-10); return fmtDate(d); }
function hourOptions(){
  let opts = '';
  for(let h=0; h<24; h++){ opts += `<option value="${h}">${String(h).padStart(2,'0')}:00</option>`; }
  return opts;
}
function halfHourOptions(){
  // 연장근무는 30분 단위(00, 30)만 사용
  let opts = '';
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0');
    opts += `<option value="${hh}:00">${hh}:00</option>`;
    opts += `<option value="${hh}:30">${hh}:30</option>`;
  }
  return opts;
}
function computeFamilyEndDate(startDateStr, requiredDays){
  // 경조휴가: 토요일은 포함하고 일요일만 카운트에서 제외
  let cur = parseDate(startDateStr);
  let last = new Date(cur);
  let count = 0;
  while(count < requiredDays){
    if(cur.getDay() !== 0){ count++; last = new Date(cur); }
    if(count >= requiredDays) break;
    cur.setDate(cur.getDate()+1);
  }
  return fmtDate(last);
}
function formatMinutes(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return `${h}시간 ${m}분`;
  if(h) return `${h}시간`;
  return `${m}분`;
}
function trimNum(n){
  const r = Math.round(n*100)/100;
  return r.toString();
}
function daysToHours(days){ return trimNum(days*8); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function isHoliday(dateStr){
  return !!(state.data.holidays && state.data.holidays.some(h=>h.date===dateStr));
}
function countBusinessDays(startStr, endStr){
  let start=parseDate(startStr), end=parseDate(endStr);
  if(end<start) return 0;
  let count=0; let cur=new Date(start);
  while(cur<=end){ if(!isWeekend(cur) && !isHoliday(fmtDate(cur))) count++; cur.setDate(cur.getDate()+1); }
  return count;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadData(){
  try{
    const res = await window.storage.get(SHARED_KEY, true);
    state.data = JSON.parse(res.value);
    if(!state.data.employees || state.data.employees.length===0){
      state.data.employees = buildSeedEmployees();
      await saveData();
    }
    if(!state.data.holidays){
      state.data.holidays = DEFAULT_HOLIDAYS_2026.slice();
      await saveData();
    }
    if(state.data.orgVersion !== ORG_VERSION){
      // 조직도가 통째로 교체됨: 기존 구성원/신청내역을 지우고 새 조직도로 재등록
      state.data.employees = buildSeedEmployees();
      state.data.requests = [];
      state.data.orgVersion = ORG_VERSION;
      await saveData();
    }
    if(!state.data.grantedNamHongFullView){
      // 기존 데이터를 지우지 않고 김남홍에게 업무지원팀장(정나은)과 동일한 열람 권한만 부여
      const nh = state.data.employees.find(e=>e.name==='김남홍');
      if(nh){ nh.isFullViewer = true; }
      state.data.grantedNamHongFullView = true;
      await saveData();
    }
    if(!state.data.empNoPadded){
      // 기존 데이터를 지우지 않고 사번을 두 자리(0 패딩) 형식으로 통일
      state.data.employees.forEach(e=>{ e.empNo = String(e.empNo).padStart(2,'0'); });
      state.data.empNoPadded = true;
      await saveData();
    }
    if(!state.data.importedLeaveBatch2){
      // 엑셀 데이터가 수정되어 재반영: 기존에 일괄 반영했던 기록은 지우고 최신 데이터로 다시 반영
      state.data.requests = state.data.requests.filter(r=>!r.bulkImported);
      IMPORTED_LEAVE_BATCH_1.forEach(rec=>{
        const emp = state.data.employees.find(e=>String(e.empNo).padStart(2,'0')===rec.empNo);
        if(!emp) return;
        const newReq = {
          id: uid('req'), employeeId: emp.id, type: rec.type,
          startDate: rec.startDate, endDate: rec.endDate,
          halfType: rec.halfType||null, splitStart: rec.splitStart!=null?rec.splitStart:null, splitEnd: rec.splitEnd!=null?rec.splitEnd:null,
          otStart:null, otEnd:null, otMinutes:null, familySub:null,
          days: rec.days, reason:'엑셀 일괄 반영', status:'approved', rejectReason:'',
          createdAt: Date.parse(rec.startDate) || Date.now(),
          isBackdated: false, bulkImported: true, approverId: null
        };
        state.data.requests.push(newReq);
      });
      state.data.importedLeaveBatch2 = true;
      await saveData();
    }
    if(!state.data.defaultPasswordUpdatedV1){
      // 아직 예전 초기 비밀번호(abinit!)를 그대로 쓰고 있는 계정만 새 기본 비밀번호로 갱신
      // (이미 본인이 직접 비밀번호를 바꾼 계정은 건드리지 않음)
      state.data.employees.forEach(e=>{
        if(e.password === 'abinit!'){ e.password = DEFAULT_PASSWORD; }
      });
      state.data.defaultPasswordUpdatedV1 = true;
      await saveData();
    }
    if(!state.data.addedLeeDongwonAdmin){
      // 대표이사 이동원(사번 09) 추가: 기안/승인은 하지 않고 전체 열람과 관리자 권한만 부여
      if(!state.data.employees.some(e=>String(e.empNo).padStart(2,'0')==='09')){
        state.data.employees.push({
          id: uid('emp'), empNo:'09', password: DEFAULT_PASSWORD,
          name:'이동원', team:'본사', position:'대표이사',
          isAdmin:true, isApprover:false, isHrApprover:false, isFullViewer:true,
          annualTotal:0, baseUsed:0
        });
      }
      state.data.addedLeeDongwonAdmin = true;
      await saveData();
    }
    if(!state.data.fixedDec26YearV1){
      // 정태건/양민우/김규동의 12/26 연차는 작년(전년도) 사용분이며, 올해 연차에서 차감되는 케이스라 날짜를 2025-12-26으로 보정
      const targets = ['01','26','27'];
      state.data.requests.forEach(r=>{
        const emp = empById(r.employeeId);
        if(!emp) return;
        const empNoPadded = String(emp.empNo).padStart(2,'0');
        if(r.bulkImported && r.type==='annual' && targets.includes(empNoPadded) && r.startDate==='2026-12-26'){
          r.startDate = '2025-12-26';
          r.endDate = '2025-12-26';
        }
      });
      state.data.fixedDec26YearV1 = true;
      await saveData();
    }
  }catch(e){
    const freshEmployees = buildSeedEmployees();
    const freshRequests = [];
    IMPORTED_LEAVE_BATCH_1.forEach(rec=>{
      const emp = freshEmployees.find(x=>String(x.empNo).padStart(2,'0')===rec.empNo);
      if(!emp) return;
      freshRequests.push({
        id: uid('req'), employeeId: emp.id, type: rec.type,
        startDate: rec.startDate, endDate: rec.endDate,
        halfType: rec.halfType||null, splitStart: rec.splitStart!=null?rec.splitStart:null, splitEnd: rec.splitEnd!=null?rec.splitEnd:null,
        otStart:null, otEnd:null, otMinutes:null, familySub:null,
        days: rec.days, reason:'엑셀 일괄 반영', status:'approved', rejectReason:'',
        createdAt: Date.parse(rec.startDate) || Date.now(),
        isBackdated: false, bulkImported: true, approverId: null
      });
    });
    state.data = { employees: freshEmployees, requests: freshRequests, holidays: DEFAULT_HOLIDAYS_2026.slice(), orgVersion: ORG_VERSION, grantedNamHongFullView: true, empNoPadded: true, importedLeaveBatch2: true, defaultPasswordUpdatedV1: true, addedLeeDongwonAdmin: true, fixedDec26YearV1: true };
    await saveData();
  }
}

function isFinalOvertimeApprover(emp){
  return !!emp && !!emp.isHrApprover;
}
function finalApproverName(){
  const e = state.data.employees.find(x=>x.isHrApprover);
  return e ? e.name : '미지정';
}
function isLeaderPosition(emp){
  return !!emp && LEADER_POSITIONS.includes(emp.position);
}
function findTeamLeader(team){
  return state.data.employees.find(e=>e.team===team && LEADER_POSITIONS.includes(e.position));
}
function canApprove(r){
  if(!state.me || !state.me.isApprover) return false;
  const owner = empById(r.employeeId);
  if(!owner) return false;
  if(r.type==='overtime'){
    if(r.status==='pending'){
      // 1차: 본인이 속한 팀장/지점장 (본인이 리더면 자동승인되어 이 상태에 머물지 않음)
      const leader = findTeamLeader(owner.team);
      if(!leader) return isFinalOvertimeApprover(state.me); // 팀장이 없으면 최종승인자가 대신 처리
      return state.me.id === leader.id;
    }
    if(r.status==='pending_hr'){
      // 2차(최종): 지정된 연장근무 최종 승인자
      return isFinalOvertimeApprover(state.me);
    }
    return false;
  }
  // 일반 유형: 본인이 속한 팀의 팀장/지점장만 승인 가능 (본인이 리더면 이미 자동승인되어 대기 상태가 아님)
  const leader = findTeamLeader(owner.team);
  if(leader) return state.me.id === leader.id;
  return isFinalOvertimeApprover(state.me); // 팀장이 없는 경우의 안전장치
}
function myPendingCount(){
  if(!state.me || !state.me.isApprover) return 0;
  return state.data.requests.filter(r=>(r.status==='pending'||r.status==='pending_hr') && canApprove(r)).length;
}
function visibleEmployeesForStatus(viewer){
  // 본인, 본인이 속한 팀의 팀장/지점장, 연장근무 최종승인자, 시스템 관리자, 전체열람 권한자만 조회 가능
  if(viewer.isAdmin || isFinalOvertimeApprover(viewer) || viewer.isFullViewer) return state.data.employees;
  if(isLeaderPosition(viewer)) return state.data.employees.filter(e=>e.team===viewer.team);
  return state.data.employees.filter(e=>e.id===viewer.id);
}
function annualUsed(empId){
  const emp = empById(empId);
  const base = emp && emp.baseUsed ? emp.baseUsed : 0;
  const fromApp = state.data.requests
    .filter(r=>r.employeeId===empId && r.status==='approved' && LEAVE_TYPES[r.type].deduct)
    .reduce((sum,r)=> sum + r.days, 0);
  return base + fromApp;
}
function empName(id){ const e=state.data.employees.find(x=>x.id===id); return e? e.name : '알 수 없음'; }
function empById(id){ return state.data.employees.find(x=>x.id===id); }

        <div class="stat-value">${remain}<span style="font-size:16px;color:var(--muted);"> / ${state.me.annualTotal}일</span></div>
        <div class="stat-sub">${remainHours}시간 남음 · 사용 ${used}일(${usedHours}시간) · 1일=8시간, 반차=4시간 기준</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">내 신청 건수</div>
        <div class="stat-value">${myReqs.length? state.data.requests.filter(r=>r.employeeId===state.me.id).length : 0}</div>
        <div class="stat-sub">누적 신청 건</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">${state.me.isApprover? '결재 대기' : '전체 구성원'}</div>
        <div class="stat-value">${state.me.isApprover? pendingAll.length : state.data.employees.length}</div>
        <div class="stat-sub">${state.me.isApprover? '승인 대기 중인 요청':'등록된 구성원 수'}</div>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="section-title">최근 내 신청 <span class="switch-link" data-nav2="my-requests" style="font-size:12px;">전체 보기 →</span></div>
        <div class="req-list" id="recent-list"></div>
      </div>
      <div class="card">
        <div class="section-title">이번 달 팀 현황</div>
        <div id="mini-cal"></div>
      </div>
    </div>
  `;
  document.querySelector('[data-nav2="my-requests"]').onclick=()=>{ state.view='my-requests'; renderApp(); };
  const list = document.getElementById('recent-list');
  if(myReqs.length===0){
    list.innerHTML = `<div class="empty"><div class="empty-icon">🗂️</div>아직 신청 내역이 없어요.</div>`;
  }else{
    list.innerHTML = myReqs.map(r=>reqCardHTML(r,false)).join('');
  }
  renderMiniCalendar(document.getElementById('mini-cal'));
}

function renderMiniCalendar(container){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let html = `<div style="font-family:var(--mono); font-weight:700; font-size:13px; margin-bottom:10px;">${year}.${String(month+1).padStart(2,'0')}</div>`;
  html += `<div class="cal-grid" style="gap:4px;">`;
  ['일','월','화','수','목','금','토'].forEach(d=> html += `<div class="cal-dow" style="font-size:10px;">${d}</div>`);
  for(let i=0;i<startOffset;i++) html += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = fmtDate(new Date(year,month,d));
    const dayReqs = state.data.requests.filter(r=> r.status!=='rejected' && r.status!=='cancelled' && r.type!=='overtime' && dateStr>=r.startDate && dateStr<=r.endDate);
    const isToday = d===now.getDate();
    html += `<div style="aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-size:10.5px; position:relative;
      background:${dayReqs.length? 'var(--brand)':'transparent'}; color:${dayReqs.length?'#fff':'var(--ink-soft)'};
      ${isToday? 'box-shadow:inset 0 0 0 1.5px var(--stamp-red);':''}">
      ${d}
      ${dayReqs.length? `<span style="position:absolute; bottom:-1px; right:-1px; background:var(--stamp-red); color:#fff; border-radius:50%; width:13px; height:13px; font-size:8px; display:flex; align-items:center; justify-content:center;">${dayReqs.length}</span>`:''}
    </div>`;
  }
  html += `</div><div class="hint">숫자는 해당 날짜에 휴가/훈련 중인 인원 수예요.</div>`;
  container.innerHTML = html;
}

/* ---------------- REQUEST CARD ---------------- */
function reqCardHTML(r, showActions, showApproverActions, note, showAdminCancel){
  const t = LEAVE_TYPES[r.type];
  const dateLabel = r.type==='half'
    ? (r.halfType==='split'
        ? `${r.startDate} · ${String(r.splitStart).padStart(2,'0')}:00~${String(r.splitEnd).padStart(2,'0')}:00 분할반차 (${r.splitEnd-r.splitStart}시간)`
        : `${r.startDate} · ${r.halfType==='am'?'오전':'오후'} 반차`)
    : r.type==='overtime'
    ? `${r.startDate} · ${r.otStart}~${r.otEnd} (${formatMinutes(r.otMinutes)})`
    : r.type==='family'
    ? `${r.startDate} ~ ${r.endDate} · ${FAMILY_SUBTYPES[r.familySub]? FAMILY_SUBTYPES[r.familySub].label : ''} (${r.days}일, 일요일 제외)`
    : (r.startDate===r.endDate? r.startDate : `${r.startDate} ~ ${r.endDate}`);
  const stampClass = r.noApprovalNeeded? 'info' : (r.status==='approved'?'':((r.status==='rejected'||r.status==='cancelled')?'rejected':'pending'));
  const stampLabel = r.noApprovalNeeded? '등록완료' : (r.status==='approved'?'승인':(r.status==='rejected'?'반려':(r.status==='cancelled'?'취소됨':(r.status==='pending_hr'?'1차승인':'대기중'))));
  return `
  <div class="req-card">
    <div class="req-type-chip" style="background:${t.soft}; color:${t.color};">${t.icon} ${t.label}</div>
    ${r.isBackdated? `<div class="req-type-chip" style="background:var(--stamp-red-soft); color:var(--stamp-red);">🕘 사후신청</div>`:''}
    <div class="req-main">
      <div class="req-title-row">
        <span class="req-name">${empName(r.employeeId)}</span>
        <span class="req-dates" style="color:var(--muted);">${(empById(r.employeeId)||{}).team||''}</span>
        <span class="req-dates">${dateLabel}${t.deduct? ` · ${trimNum(r.days)}일(${daysToHours(r.days)}시간) 차감`:''}</span>
      </div>
      ${r.reason? `<div class="req-reason">사유: ${escapeHTML(r.reason)}</div>`:''}
      ${r.status==='rejected' && r.rejectReason? `<div class="req-reason" style="color:var(--stamp-red);">반려 사유: ${escapeHTML(r.rejectReason)}</div>`:''}
      ${r.status==='cancelled'? `<div class="req-reason" style="color:var(--stamp-red);">승인 후 취소됨 (처리: ${empName(r.cancelledBy)})</div>`:''}
      ${r.type==='overtime' && r.status==='approved' ? `<div class="req-reason">1차 승인: ${empName(r.teamApproverId)} · 최종 승인: ${empName(r.hrApproverId)}</div>`:''}
      ${r.type==='overtime' && r.status==='pending_hr' && r.teamApproverId ? `<div class="req-reason">1차 승인: ${empName(r.teamApproverId)}</div>`:''}
      ${r.autoApproved? `<div class="req-reason" style="color:var(--green);">⚡ 자동승인 — 기안자가 팀장/지점장/부사장이라 별도 결재 없이 처리됨</div>`:''}
      ${r.noApprovalNeeded? `<div class="req-reason" style="color:#3B7B7B;">🧳 출장은 결재 없이 신청 즉시 등록돼요 — 동료들이 행방을 알 수 있도록 캘린더에 표시돼요</div>`:''}
      ${r.bulkImported? `<div class="req-reason" style="color:var(--muted);">📥 엑셀로 일괄 반영된 기록이에요 (사후신청 아님)</div>`:''}
      ${note? `<div class="req-reason" style="color:var(--amber);">${note}</div>`:''}
    </div>
    ${showApproverActions && (r.status==='pending'||r.status==='pending_hr') ? `
      <div class="req-actions">
        <button class="btn btn-sm btn-approve" data-approve="${r.id}">승인</button>
        <button class="btn btn-sm btn-reject" data-reject="${r.id}">반려</button>
      </div>
    ` : `<div class="stamp ${stampClass}">${stampLabel}</div>`}
    ${showActions && (r.status==='pending'||r.status==='pending_hr') ? `
      <button class="btn btn-sm btn-danger" data-cancel="${r.id}" style="margin-left:8px;">신청 취소</button>
    `:''}
    ${showAdminCancel && r.status==='approved' ? `
      <button class="btn btn-sm btn-danger" data-admin-cancel="${r.id}" style="margin-left:8px;">승인 취소(철회)</button>
    `:''}
  </div>`;
}
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------------- REQUEST FORM ---------------- */
function renderRequestForm(main){
  main.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">New Request</div>
      <h1 class="page-title">근태 신청</h1>
      <p class="page-desc">유형을 선택하고 필요한 정보를 입력한 뒤 제출하세요. 제출 즉시 승인자에게 전달돼요.</p>
    </div>
    <div class="card form-card">
      <div class="type-grid" id="type-grid">
        ${Object.entries(LEAVE_TYPES).map(([key,t])=>`
          <div class="type-opt ${state.formType===key?'selected':''}" data-type="${key}">${t.icon}<br>${t.label}</div>
        `).join('')}
      </div>
      <div id="date-fields"></div>
      <div class="field">
        <label>사유 (선택)</label>
        <textarea id="reason-input" rows="2" placeholder="간단한 사유를 남겨주세요"></textarea>
      </div>
      <button class="btn btn-primary" id="submit-req">신청 제출</button>
    </div>
  `;
  document.querySelectorAll('[data-type]').forEach(el=>{
    el.onclick = ()=>{ state.formType = el.dataset.type; renderRequestForm(main); };
  });
  renderDateFields();

  document.getElementById('submit-req').onclick = async ()=>{
    const type = state.formType;
    const t = LEAVE_TYPES[type];
    let startDate, endDate, halfType=null, splitStart=null, splitEnd=null, otStart=null, otEnd=null, otMinutes=null, familySub=null, days=0;
    if(type==='half'){
      startDate = endDate = document.getElementById('single-date').value;
      halfType = state.formHalf;
      if(halfType==='split'){
        splitStart = parseInt(document.getElementById('split-start').value, 10);
        splitEnd = parseInt(document.getElementById('split-end').value, 10);
        if(splitEnd <= splitStart){ showToast('종료 시간은 시작 시간보다 늦어야 해요.'); return; }
        const hours = splitEnd - splitStart;
        days = Math.round((hours/8)*1000)/1000;
      }else{
        days = 0.5;
      }
    }else if(type==='overtime'){
      startDate = endDate = document.getElementById('ot-date').value;
      otStart = document.getElementById('ot-start').value;
      otEnd = document.getElementById('ot-end').value;
      if(!otStart || !otEnd){ showToast('시작/종료 시간을 입력해주세요.'); return; }
      const [sh,sm] = otStart.split(':').map(Number);
      const [eh,em] = otEnd.split(':').map(Number);
      otMinutes = (eh*60+em) - (sh*60+sm);
      if(otMinutes <= 0){ showToast('종료 시간은 시작 시간보다 늦어야 해요.'); return; }
      days = 0;
    }else if(type==='family'){
      familySub = state.formFamilySub;
      startDate = document.getElementById('family-start').value;
      const requiredDays = FAMILY_SUBTYPES[familySub].days;
      endDate = computeFamilyEndDate(startDate, requiredDays);
      days = requiredDays;
    }else{
      startDate = document.getElementById('start-date').value;
      endDate = document.getElementById('end-date').value || startDate;
      days = countBusinessDays(startDate, endDate);
    }
    if(!startDate){ showToast('날짜를 선택해주세요.'); return; }
    if(parseDate(endDate) < parseDate(startDate)){ showToast('종료일이 시작일보다 빠를 수 없어요.'); return; }
    if(parseDate(startDate) < parseDate(minAllowedDateStr())){
      showLimitModal(`오늘 기준 <strong>최대 10일 전</strong>까지만 사후 신청할 수 있어요.`);
      return;
    }

    if(t.deduct){
      const remain = state.me.annualTotal - annualUsed(state.me.id);
      if(days > remain){
        showLimitModal(`잔여 연차는 <strong>${trimNum(remain)}일 (${daysToHours(remain)}시간)</strong>이에요.<br>${trimNum(days)}일(${daysToHours(days)}시간)은 신청할 수 없어요.`);
        return;
      }
    }

    if(BLOCKING_TYPES.includes(type)){
      const conflict = findDateConflict(state.me.id, startDate, endDate);
      if(conflict){
        const ct = LEAVE_TYPES[conflict.type];
        const conflictDateLabel = conflict.startDate===conflict.endDate ? conflict.startDate : `${conflict.startDate} ~ ${conflict.endDate}`;
        showLimitModal(`이미 <strong>${conflictDateLabel}</strong>에<br><strong>${ct.icon} ${ct.label}</strong> 신청이 있어요.<br>날짜가 겹치는 신청은 등록할 수 없어요.`);
        return;
      }
    }
    const reason = document.getElementById('reason-input').value.trim();

    const newReq = {
      id: uid('req'), employeeId: state.me.id, type, startDate, endDate,
      halfType, splitStart, splitEnd, otStart, otEnd, otMinutes, familySub,
      days, reason, status:'pending', rejectReason:'', createdAt: Date.now(),
      isBackdated: parseDate(startDate) < parseDate(todayStr())
    };

    // 출장은 결재가 필요 없는 유형: 누구든 신청 즉시 등록(승인) 처리
    if(LEAVE_TYPES[type].noApproval){
      newReq.status = 'approved';
      newReq.approverId = null;
      newReq.noApprovalNeeded = true;
    }
    // 팀장/지점장/부사장 본인 기안 건은 결재 없이 자동승인 (로그로 남김)
    else if(isLeaderPosition(state.me)){
      if(type==='overtime'){
        newReq.teamApproverId = state.me.id;
        newReq.teamApprovedAt = Date.now();
        newReq.autoApproved = true;
        if(isFinalOvertimeApprover(state.me)){
          newReq.status = 'approved';
          newReq.hrApproverId = state.me.id;
          newReq.hrApprovedAt = Date.now();
          newReq.approverId = state.me.id;
        }else{
          newReq.status = 'pending_hr';
        }
      }else{
        newReq.status = 'approved';
        newReq.approverId = state.me.id;
        newReq.autoApproved = true;
      }
    }

    let showToastMsg = '신청이 제출되었어요. 승인을 기다려주세요.';
    if(newReq.noApprovalNeeded) showToastMsg = '출장이 등록됐어요. 별도 결재 없이 바로 반영돼요.';
    else if(newReq.status==='approved') showToastMsg = '신청이 제출과 동시에 자동 승인됐어요.';
    else if(newReq.status==='pending_hr') showToastMsg = `1차(본인) 승인이 자동 처리됐어요. ${finalApproverName()}님의 최종 승인만 남았어요.`;

    state.data.requests.push(newReq);
    await saveData();
    showToast(showToastMsg);
    state.view='my-requests';
    renderApp();
  };
}

/* ---------------- APPROVALS ---------------- */
function renderApprovals(main){
  const pending = state.data.requests.filter(r=>r.status==='pending'||r.status==='pending_hr').sort((a,b)=>a.createdAt-b.createdAt);
  const decided = state.data.requests.filter(r=>r.status!=='pending' && r.status!=='pending_hr').sort((a,b)=>b.createdAt-a.createdAt).slice(0,8);
  main.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Approvals</div>
      <h1 class="page-title">승인함</h1>
      <p class="page-desc">대기 중인 요청 ${pending.length}건이 있어요.</p>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div class="section-title">결재 대기</div>
      <div class="req-list" id="pending-list"></div>
    </div>
    <div class="card">
      <div class="section-title">최근 처리 내역</div>
      <div class="req-list" id="decided-list"></div>
    </div>
  `;
  const pList = document.getElementById('pending-list');
  pList.innerHTML = pending.length? pending.map(r=>{
    const iCanAct = canApprove(r);
    const owner = empById(r.employeeId);
    let note = null;
    if(!iCanAct){
      if(r.type==='overtime'){
        if(r.status==='pending'){
          const leader = owner ? findTeamLeader(owner.team) : null;
          note = leader ? `${leader.name}님(팀장/지점장) 1차 승인 필요` : '팀장/지점장 1차 승인 필요';
        }else if(r.status==='pending_hr'){
          note = `${finalApproverName()}님(연장근무 최종승인자) 승인 필요`;
        }
      }else{
        const leader = owner ? findTeamLeader(owner.team) : null;
        note = leader ? `${leader.name}님(팀장/지점장) 승인 필요` : '담당 팀장/지점장 승인 필요';
      }
    }
    return reqCardHTML(r, false, iCanAct, note);
  }).join('') : `<div class="empty"><div class="empty-icon">✅</div>처리할 요청이 없어요.</div>`;
  const dList = document.getElementById('decided-list');
  dList.innerHTML = decided.length? decided.map(r=>reqCardHTML(r,false,false)).join('') : `<div class="empty">처리 내역이 없어요.</div>`;

  document.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = async ()=>{
      const r = state.data.requests.find(x=>x.id===btn.dataset.approve);
      if(!canApprove(r)){ showToast('이 신청은 본인만 승인할 수 있어요.'); return; }
      if(r.type==='overtime' && r.status==='pending'){
        r.teamApproverId=state.me.id; r.teamApprovedAt=Date.now();
        if(isFinalOvertimeApprover(state.me)){
          // 1차 승인자가 최종승인자와 동일인이면 두 번 결재할 필요 없이 한 번에 최종승인 처리
          r.status='approved'; r.hrApproverId=state.me.id; r.hrApprovedAt=Date.now(); r.approverId=state.me.id;
          await saveData();
          showToast(`${empName(r.employeeId)}님의 연장근무를 승인했어요.`);
        }else{
          r.status='pending_hr';
          await saveData();
          showToast(`${empName(r.employeeId)}님의 연장근무를 1차 승인했어요. ${finalApproverName()}님의 최종 승인이 남았어요.`);
        }
      }else{
        r.status='approved'; r.approverId=state.me.id;
        if(r.type==='overtime') r.hrApproverId=state.me.id;
        await saveData();
        showToast(`${empName(r.employeeId)}님의 신청을 승인했어요.`);
      }
      renderApprovals(main);
    };
  });
  document.querySelectorAll('[data-reject]').forEach(btn=>{
    btn.onclick = async ()=>{
      const r = state.data.requests.find(x=>x.id===btn.dataset.reject);
      if(!canApprove(r)){ showToast('이 신청은 본인만 승인할 수 있어요.'); return; }
      const reason = prompt('반려 사유를 입력해주세요 (선택)') || '';
      r.status='rejected'; r.rejectReason=reason; r.approverId=state.me.id;
      await saveData();
      showToast(`${empName(r.employeeId)}님의 신청을 반려했어요.`);
      renderApprovals(main);
    };
  });
}

/* ---------------- CALENDAR ---------------- */
function renderCalendar(main){
  main.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Company Calendar</div>
      <h1 class="page-title">회사 캘린더</h1>
      <p class="page-desc">구성원들의 승인/대기 중인 근태를 한눈에 확인하세요.</p>
    </div>
    <div class="card">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="btn btn-ghost btn-sm" id="cal-prev" style="width:auto;">‹ 이전</button>
          <div class="cal-month">${state.calYear}.${String(state.calMonth+1).padStart(2,'0')}</div>
          <button class="btn btn-ghost btn-sm" id="cal-next" style="width:auto;">다음 ›</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="cal-today" style="width:auto;">오늘</button>
      </div>
      <div class="cal-grid" id="cal-body"></div>
      <div class="legend">
        ${Object.entries(LEAVE_TYPES).filter(([key])=>key!=='overtime').map(([key,t])=>`<div class="legend-item"><span class="legend-dot" style="background:${t.color};"></span>${t.label}</div>`).join('')}
        <div class="legend-item"><span class="legend-dot" style="background:var(--stamp-red);"></span>일요일/공휴일</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--sat-blue);"></span>토요일</div>
      </div>
    </div>
  `;
  document.getElementById('cal-prev').onclick=()=>{ shiftMonth(-1); renderCalendar(main); };
  document.getElementById('cal-next').onclick=()=>{ shiftMonth(1); renderCalendar(main); };
  document.getElementById('cal-today').onclick=()=>{ const n=new Date(); state.calYear=n.getFullYear(); state.calMonth=n.getMonth(); renderCalendar(main); };
  buildCalGrid();
}
function shiftMonth(delta){
  let m = state.calMonth + delta, y = state.calYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calMonth=m; state.calYear=y;
}
function buildCalGrid(){
  const body = document.getElementById('cal-body');
  const year=state.calYear, month=state.calMonth;
  const first = new Date(year,month,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const now = new Date();
  let html = ['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const cellIndex = i - startOffset + 1;
    let dateObj, otherMonth=false;
    if(cellIndex<1){ dateObj=new Date(year, month-1, prevDays+cellIndex); otherMonth=true; }
    else if(cellIndex>daysInMonth){ dateObj=new Date(year, month+1, cellIndex-daysInMonth); otherMonth=true; }
    else { dateObj=new Date(year, month, cellIndex); }
    const dateStr = fmtDate(dateObj);
    const isToday = dateStr===fmtDate(now);
    const dow = dateObj.getDay();
    const holiday = isHoliday(dateStr);
    let numColor = 'var(--ink-soft)';
    if(dow===0) numColor = 'var(--stamp-red)';
    if(dow===6) numColor = 'var(--sat-blue)';
    if(holiday) numColor = 'var(--stamp-red)';
    const dayReqs = state.data.requests.filter(r=> r.status!=='rejected' && r.status!=='cancelled' && r.type!=='overtime' && dateStr>=r.startDate && dateStr<=r.endDate);
    html += `<div class="cal-cell ${otherMonth?'other-month':''} ${isToday?'today':''}" data-date="${dateStr}" style="cursor:pointer;">
      <div class="cal-daynum" style="color:${numColor}; font-weight:${holiday?'800':'600'};">${dateObj.getDate()}${holiday? ` <span style="font-size:9px; font-weight:700;">${state.data.holidays.find(h=>h.date===dateStr).label}</span>`:''}</div>
      ${dayReqs.slice(0,3).map(r=>{
        const t=LEAVE_TYPES[r.type];
        const opacity = (r.status==='pending'||r.status==='pending_hr')? '0.55':'1';
        let typeLabel = t.label;
        if(r.type==='half'){
          typeLabel = r.halfType==='am' ? '오전반차' : (r.halfType==='pm' ? '오후반차' : '분할반차');
        }
        return `<div class="cal-tag" style="background:${t.color}; color:#fff; opacity:${opacity};">${empName(r.employeeId)} · ${typeLabel}${r.isBackdated? ' (사후)':''}</div>`;
      }).join('')}
      ${dayReqs.length>3? `<div class="cal-tag" style="background:var(--gray-soft); color:var(--ink-soft);">+${dayReqs.length-3}명</div>`:''}
    </div>`;
  }
  body.innerHTML = html;
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.onclick = ()=> showDayDetailModal(cell.dataset.date);
  });
}

function showDayDetailModal(dateStr){
  const old = document.getElementById('day-detail-modal');
  if(old) old.remove();
  const dayReqs = state.data.requests.filter(r=> r.status!=='rejected' && r.status!=='cancelled' && r.type!=='overtime' && dateStr>=r.startDate && dateStr<=r.endDate);
  const holiday = isHoliday(dateStr);
  const holidayLabel = holiday? state.data.holidays.find(h=>h.date===dateStr).label : null;
  const d = parseDate(dateStr);
  const dowLabel = ['일','월','화','수','목','금','토'][d.getDay()];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'day-detail-modal';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:520px; text-align:left;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <div>
          <div style="font-family:var(--mono); font-size:13px; color:var(--muted);">${dateStr} (${dowLabel})${holidayLabel? ` · ${holidayLabel}`:''}</div>
          <div style="font-weight:800; font-size:18px;">이 날짜의 근태 현황</div>
        </div>
        <button class="btn btn-sm btn-ghost" id="day-modal-close" style="width:auto;">닫기</button>
      </div>
      <div class="req-list" style="max-height:60vh; overflow-y:auto;">
        ${dayReqs.length? dayReqs.map(r=>reqCardHTML(r,false,false)).join('') : `<div class="empty">이 날짜에 등록된 근태가 없어요.</div>`}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  document.getElementById('day-modal-close').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
}

      <div class="field">

        <input type="password" id="pw-current">
      </div>
      <div class="field">
        <label>새 비밀번호 (5자 이상)</label>
        <input type="password" id="pw-new">
      </div>
      <div class="field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pw-confirm">
      </div>
      <button class="btn btn-primary" id="pw-submit">비밀번호 변경</button>
      <div class="hint" style="margin-top:14px;">비밀번호를 잊어버렸다면 스스로 찾을 수 없고, <strong>시스템 관리자에게 요청해 초기화(기본값: ${DEFAULT_PASSWORD})</strong>받아야 해요. 초기화 후 다시 로그인해서 이 화면에서 새 비밀번호로 바꿔주세요.</div>
    </div>
  `;
  document.getElementById('pw-submit').onclick = async ()=>{
    const current = document.getElementById('pw-current').value;
    const next = document.getElementById('pw-new').value;
    const confirm2 = document.getElementById('pw-confirm').value;
    if(current !== state.me.password){ showToast('현재 비밀번호가 올바르지 않아요.'); return; }
    if(next.length < 5){ showToast('새 비밀번호는 5자 이상이어야 해요.'); return; }
    if(next !== confirm2){ showToast('새 비밀번호가 서로 일치하지 않아요.'); return; }

    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
  };

        </div>
      </div>
      <div class="field">
        <label style="display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;">소속 팀/지점</label>

  body.innerHTML = sortedEmployees.map(e=>{
    const used = annualUsed(e.id);
    const remain = (e.annualTotal - used).toFixed(1).replace(/\.0$/,'');
    return `
    <tr>
      <td style="font-family:var(--mono); color:var(--ink-soft);">${e.empNo||''}</td>
      <td><strong>${e.name}</strong>${e.id===state.me.id?' <span style="color:var(--muted); font-size:11px;">(나)</span>':''}</td>
      <td><input type="text" class="balance-input" style="width:88px;" data-team="${e.id}" value="${e.team||''}"></td>
      <td>
        <select data-position="${e.id}" style="padding:5px 6px; border-radius:7px; border:1.5px solid var(--line); font-size:12.5px;">
          <option value="팀원" ${e.position==='팀원'?'selected':''}>팀원</option>
          <option value="팀장" ${e.position==='팀장'?'selected':''}>팀장</option>
          <option value="지점장" ${e.position==='지점장'?'selected':''}>지점장</option>
          <option value="대표이사" ${e.position==='대표이사'?'selected':''}>대표이사</option>
          <option value="부사장" ${e.position==='부사장'?'selected':''}>부사장</option>
        </select>
      </td>
      <td>
        <button class="toggle-btn ${e.isApprover?'on':''}" data-toggle-approver="${e.id}">승인자</button>
        <button class="toggle-btn ${e.isHrApprover?'on':''}" data-toggle-hr="${e.id}" style="margin-top:4px;">연장근무 최종승인</button>
        <button class="toggle-btn ${e.isFullViewer?'on':''}" data-toggle-fullview="${e.id}" style="margin-top:4px;">연차/연장근무 전체열람</button>
        <button class="toggle-btn ${e.isAdmin?'on':''}" data-toggle-admin="${e.id}" style="margin-top:4px;">시스템 관리자</button>
      </td>
      <td><input type="text" inputmode="decimal" class="balance-input" data-balance="${e.id}" value="${e.annualTotal}"></td>
      <td><input type="text" inputmode="decimal" class="balance-input" data-baseused="${e.id}" value="${e.baseUsed||0}"></td>
      <td style="font-family:var(--mono); color:var(--ink-soft);">${remain}일 (${daysToHours(e.annualTotal-used)}시간)</td>
      <td>
        <button class="btn btn-sm btn-ghost" data-reset-pw="${e.id}" style="width:auto; margin-bottom:4px;">PW 초기화</button>
        ${!e.isAdmin? `<button class="btn btn-sm btn-danger" data-remove="${e.id}">삭제</button>`:''}
      </td>
    </tr>`;
  }).join('');

  document.querySelectorAll('[data-toggle-approver]').forEach(btn=>{
    btn.onclick = async ()=>{
      const e = empById(btn.dataset.toggleApprover);
      e.isApprover = !e.isApprover;
      await saveData();
      renderMembers(main);
    };
  });
  document.querySelectorAll('[data-toggle-hr]').forEach(btn=>{
    btn.onclick = async ()=>{
      const e = empById(btn.dataset.toggleHr);
      e.isHrApprover = !e.isHrApprover;
      await saveData();
      showToast(e.isHrApprover? `${e.name}님을 연장근무 최종승인자로 지정했어요.` : `${e.name}님의 연장근무 최종승인자 지정을 해제했어요.`);
      renderMembers(main);
    };
  });
  document.querySelectorAll('[data-toggle-fullview]').forEach(btn=>{
    btn.onclick = async ()=>{
      const e = empById(btn.dataset.toggleFullview);
      e.isFullViewer = !e.isFullViewer;
      await saveData();
      showToast(e.isFullViewer? `${e.name}님에게 연차/연장근무 전체열람 권한을 부여했어요.` : `${e.name}님의 전체열람 권한을 해제했어요.`);
      renderMembers(main);
    };
  });
  document.querySelectorAll('[data-toggle-admin]').forEach(btn=>{
    btn.onclick = async ()=>{
      const e = empById(btn.dataset.toggleAdmin);

      await saveData();
      showToast(e.isAdmin? `${e.name}님을 시스템 관리자로 지정했어요.` : `${e.name}님의 시스템 관리자 권한을 해제했어요.`);

      showToast(`${e.name}님의 비밀번호를 기본값(${DEFAULT_PASSWORD})으로 초기화했어요.`);

    };
  });
  document.querySelectorAll('[data-baseused]').forEach(inp=>{
    inp.onchange = async ()=>{
      const e = empById(inp.dataset.baseused);

      if(!isNaN(v) && v>=0){ e.baseUsed = v; await saveData(); showToast('사용갯수를 수정했어요.'); }

    };

  document.querySelectorAll('[data-team]').forEach(inp=>{

      const e = empById(inp.dataset.team);

      await saveData();
      renderMembers(main);
    };

    const empNo = empNoRaw.padStart(2, '0');
    const name = document.getElementById('new-member-name').value.trim();
    const position = document.getElementById('new-member-position').value;
    const password = document.getElementById('new-member-password').value.trim() || DEFAULT_PASSWORD;

    if(state.data.holidays.some(h=>h.date===date)){ showToast('이미 등록된 날짜예요.'); return; }
    state.data.holidays.push({date, label});
    state.data.holidays.sort((a,b)=> a.date.localeCompare(b.date));
    await saveData();
    showToast('공휴일을 추가했어요.');
    renderMembers(main);
  };
}
function renderHolidayList(){
  const list = document.getElementById('holiday-list');
  const holidays = (state.data.holidays||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(holidays.length===0){
    list.innerHTML = `<div class="empty">등록된 공휴일이 없어요.</div>`;
    return;
  }
  list.innerHTML = holidays.map(h=>`
    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13.5px;">
      <div><span style="font-family:var(--mono); color:var(--ink-soft); margin-right:10px;">${h.date}</span>${h.label}</div>
      <button class="btn btn-sm btn-danger" data-remove-holiday="${h.date}">삭제</button>
    </div>
  `).join('');
  document.querySelectorAll('[data-remove-holiday]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.data.holidays = state.data.holidays.filter(h=>h.date!==btn.dataset.removeHoliday);
      await saveData();
      showToast('공휴일을 삭제했어요.');
      renderHolidayList();
    };
  });
}
