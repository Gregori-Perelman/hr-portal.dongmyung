name: Daily HR Portal Backup Email

on:
  schedule:
    # 15:00 UTC = 00:00 KST(한국시간, 자정) 다음날
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  send-backup-email:
    runs-on: ubuntu-latest
    steps:
      - name: Call backup-email endpoint
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" "https://hr-portal-dongmyung.onrender.com/api/backup-email?key=${{ secrets.BACKUP_SECRET }}"
